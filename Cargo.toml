[package]
name = "soroban-agent-account"
version = "0.1.0"
edition = "2021"
authors = ["OrderStream <healthdecoded77@gmail.com>"]
description = "Autonomous AI Agent Smart Account & Policy-Enforced Spending Wallet for Stellar Soroban Protocol 22 with daily spending caps, target whitelisting, and session TTLs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/OrderStream/soroban-agent-account"
readme = "README.md"
keywords = ["stellar", "soroban", "ai-agents", "smart-account", "security"]

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"
